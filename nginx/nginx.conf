worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  proxy_cache_path /var/cache/nginx/packages levels=1:2 keys_zone=packages:100m inactive=30d max_size=500g use_temp_path=off;
  proxy_cache_path /var/cache/nginx/simple levels=1:2 keys_zone=simple:20m inactive=5m max_size=1g;

  upstream synthesizer {
    server python-proxy:8000;
    keepalive 32;
  }

  # log format with cache status + upstream time for bench
  log_format bench '$remote_addr - $request - $status $body_bytes_sent '
                   'cache:$upstream_cache_status rt:$request_time urt:$upstream_response_time '
                   'accept:"$http_accept"';

  access_log /var/log/nginx/access.log bench;

  # proxy_pass below uses a variable for the host, so nginx defers name
  # resolution to request time and REQUIRES a resolver — without one every
  # /artifacts/ request fails with "no resolver defined to resolve <host>".
  # 127.0.0.11 is the embedded Docker DNS; point this at your resolver in prod.
  resolver 127.0.0.11 ipv6=off valid=30s;
  resolver_timeout 5s;

  # Host allowlist for /artifacts/<host>/... — keep in sync with
  # UPSTREAM_FILES_URL / ARTIFACT_HOST_ALLOWLIST on python-proxy.
  #
  # The value is the scheme to reach the host on, so the allowlist and the
  # scheme cannot drift apart: empty means "not allowed". An internal index
  # added to ARTIFACT_HOST_ALLOWLIST may well be plain http, which a hardcoded
  # https:// in proxy_pass would fail to reach (set ARTIFACT_HOST_SCHEME to
  # match on the python-proxy side).
  map $artifact_host $artifact_scheme {
    default                 "";
    files.pythonhosted.org  https;
  }

  server {
    listen 80;
    server_name _;

    # /simple/ -> python synthesizer (cached)
    location ~ ^/simple/ {
      proxy_cache simple;
      proxy_cache_key "$scheme$request_method$host$request_uri$http_accept";
      proxy_cache_valid 200 5m;
      proxy_cache_valid 404 1m;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_cache_lock_timeout 10s;
      add_header X-Nginx-Cache $upstream_cache_status always;

      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header Accept $http_accept;
      proxy_pass http://synthesizer;
      proxy_connect_timeout 5s;
      proxy_read_timeout 15s;
    }

    # health/metrics passthrough
    location ~ ^/(health|metrics) {
      proxy_pass http://synthesizer;
      proxy_set_header Host $host;
    }

    # artifacts via host-scoped path (from Simple URL rewrite)
    # /artifacts/<host>/<path> — host must come from allowlisted Simple rewrites
    # PEP 658/714 metadata is generated and stored by the synthesizer.  Keep
    # this location before the general artifact regex so metadata requests do
    # not leak through to an upstream that does not implement them.
    location ~ ^/artifacts/(?<artifact_host>[^/]+)(?<artifact_uri>/.*\.whl\.metadata)$ {
      if ($artifact_scheme = "") {
        return 403;
      }
      proxy_cache packages;
      proxy_cache_key "metadata:$uri$is_args$args";
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_pass http://synthesizer;
      proxy_connect_timeout 5s;
      proxy_read_timeout 30s;
      proxy_intercept_errors on;
      error_page 404 = @artifact_metadata_upstream;
      add_header X-Nginx-Cache $upstream_cache_status always;
    }

    # Preserve indexes whose origin already implements PEP 658. This internal
    # fallback is reached only after the synthesizer reports no generated copy.
    location @artifact_metadata_upstream {
      proxy_cache packages;
      proxy_cache_key "metadata:$uri$is_args$args";
      proxy_cache_valid 200 30d;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      proxy_cache_lock on;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_pass $artifact_scheme://$artifact_host$artifact_uri$is_args$args;
      proxy_set_header Host $artifact_host;
      add_header X-Nginx-Cache $upstream_cache_status always;
    }

    location ~ ^/artifacts/(?<artifact_host>[^/]+)(?<artifact_uri>/.*)$ {
      if ($artifact_scheme = "") {
        return 403;
      }
      proxy_cache packages;
      proxy_cache_key "$uri$is_args$args$slice_range";
      proxy_cache_valid 200 206 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      slice 1m;
      proxy_set_header Range $slice_range;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_ssl_server_name on;
      proxy_pass $artifact_scheme://$artifact_host$artifact_uri$is_args$args;
      proxy_set_header Host $artifact_host;
      add_header X-Nginx-Cache $upstream_cache_status always;
    }

    # legacy path aliases still point at the PyPI CDN
    location ~ ^/(packages|files)/ {
      proxy_cache packages;
      proxy_cache_key "$uri$is_args$args$slice_range";
      proxy_cache_valid 200 206 30d;
      proxy_cache_valid 404 1m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
      slice 1m;
      proxy_set_header Range $slice_range;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass https://files.pythonhosted.org;
      proxy_set_header Host files.pythonhosted.org;
      add_header X-Nginx-Cache $upstream_cache_status always;
    }

    location / {
      return 404 "use /simple/ or /health\n";
    }
  }
}
