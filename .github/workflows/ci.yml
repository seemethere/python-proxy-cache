name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync --extra dev --group prek

      - name: Ruff check
        run: uv run ruff check

      - name: Ruff format (check)
        run: uv run ruff format --check

      - name: Ty check
        run: uv run ty check

      - name: Pytest
        run: uv run pytest -q

      - name: Prek (all files)
        uses: j178/prek-action@v1
        with:
          extra-args: --all-files

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build docker
        run: docker compose build
