[project]
name = "python-proxy-cache"
version = "0.1.0"
description = "Pull-through PyPI cache with on-demand PEP 503 <-> PEP 691 (JSON) + PEP 658/714 synthesis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "packaging>=24",
  "redis[async]>=5",
  "pydantic>=2",
  "pydantic-settings>=2",
]

[project.optional-dependencies]
bench = ["locust>=2.20", "rich>=13"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.9",
  "ty>=0.0.10",
  "pre-commit>=4",
  "rich>=13",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.9",
  "ty>=0.0.10",
  "pre-commit>=4",
  "rich>=13",
]
prek = ["ruff>=0.9", "ty>=0.0.10"]


[project.scripts]
pproxy-bench = "bench.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bench"]

[tool.setuptools.packages.find]
include = ["app*", "bench*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["S110", "BLE001", "E501"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["app", "bench", "tests"]
